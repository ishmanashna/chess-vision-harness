name: Deploy public site

on:
  push:
    branches: [main, master]
    paths:
      - "public-site/**"
      - "deploy/sync-game-origin.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Run from public-site so Wrangler picks up ./functions (not repo-root).
          workingDirectory: public-site
          command: pages deploy . --project-name=chessvisionharness --commit-dirty=true

      - name: Sync GAME_ORIGIN (optional secret)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GAME_ORIGIN: ${{ secrets.GAME_ORIGIN }}
        run: python3 deploy/sync-game-origin.py
