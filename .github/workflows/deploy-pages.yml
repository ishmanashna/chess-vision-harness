name: Deploy public site

on:
  push:
    branches: [main, master]
    paths:
      - "public-site/**"
      - "deploy/sync-game-origin.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Inject GAME_ORIGIN for this deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GAME_ORIGIN: ${{ secrets.GAME_ORIGIN }}
        run: |
          set -euo pipefail
          if [ -z "${GAME_ORIGIN:-}" ]; then
            echo "GAME_ORIGIN secret not set; Functions will report offline until it is."
            exit 0
          fi
          ORIGIN="${GAME_ORIGIN%/}"
          # Bind into the Pages Worker for this Direct Upload.
          {
            echo ""
            echo "[vars]"
            echo "GAME_ORIGIN = \"${ORIGIN}\""
          } >> public-site/wrangler.toml
          # Keep project settings in sync for the dashboard / future swaps.
          python3 deploy/sync-game-origin.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: public-site
          command: pages deploy . --project-name=chessvisionharness --commit-dirty=true
