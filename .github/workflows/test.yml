name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install Stockfish (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y stockfish

      - name: Download engines (Windows)
        if: runner.os == 'Windows'
        run: python scripts/fetch_opponents.py

      - name: Run tests
        env:
          STOCKFISH_PATH: ${{ runner.os == 'Windows' && 'bin/stockfish-windows-x86-64.exe' || 'stockfish' }}
        run: pytest -q
