[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chess-vision-harness"
version = "0.2.0"
description = "Local harness for vision LLM agents to play chess against a catalog of rated engines, with spectator UI and engine calibration."
readme = "../README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "chess>=1.10.0",
    "pillow>=10.0.0",
    "filelock>=3.12.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "mcp>=1.28.0",
    "zstandard>=0.22.0",
]

[project.optional-dependencies]
svg = [
    "cairosvg>=2.6.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
chess-harness = "chess_harness.__main__:main"
chess-harness-mcp = "chess_harness.mcp_server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["chess_harness"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
]
