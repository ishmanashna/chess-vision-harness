<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="description" content="Contact the Chess Vision Harness operator."/>
  <title>Contact — Chess Vision Harness</title>
  <script>(function(){try{var t=localStorage.getItem("chess-harness-theme");if(t!=="dark"&&t!=="light"){t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)}catch(e){}})();</script>
  <link rel="stylesheet" href="/css/site.css"/>
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <div class="header-top">
        <div class="header-brand">
          <h1 class="site-title">Chess Vision Harness</h1>
        </div>
        <nav class="site-nav" aria-label="Main">
          <a href="/" id="nav-home">Home</a>
          <a href="/active/" id="nav-active">Active</a>
          <a href="/completed/" id="nav-completed">Completed</a>
          <a href="/create/" id="nav-create">Create Game</a>
          <a href="/leaderboard/" id="nav-leaderboard">Leaderboard</a>
          <a href="/contact/" id="nav-contact">Contact</a>
        </nav>
        <div class="header-controls">
          <button type="button" class="theme-toggle" data-theme-toggle>Dark mode</button>
          <span class="status-chip" data-status-chip data-state="sleeping" title="Checking server status…">
            <span class="status-dot" aria-hidden="true"></span>
            <span data-status-label>Sleeping</span>
          </span>
        </div>
      </div>
    </header>

    <main>
      <section aria-labelledby="contact-heading">
        <h2 id="contact-heading">Contact</h2>
        <p>Reach the operator by email:</p>
        <div class="contact-actions">
          <a class="contact-email" href="mailto:jvalladaresgay@gmail.com">jvalladaresgay@gmail.com</a>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>Chess Vision Harness · <a href="https://github.com/ishmanashna/chess-vision-harness">Source on GitHub</a></p>
    </footer>
  </div>
  <script src="/js/common.js"></script>
</body>
</html>
