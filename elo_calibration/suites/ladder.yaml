name: ladder
defaults:
  movetime_ms: 100
  max_plies: 200
  k_factor: 48
  initial_elo_non_stockfish: 500
openings: [startpos]
round_robin:
  opponents:
    - random
    - stockfish-handicap:noise5
    - stockfish-handicap:noise10
    - stockfish-handicap:noise17
    - stockfish-handicap:noise30
    - minimalchess-0.2:noise15
    - minimalchess-0.2:noise30
    - inverse-sf:exclude-top1-d8
    - inverse-sf:worst-d6
    - inverse-sf:bottom5-d6
  games_per_pair: 20
  colors: alternate
pairs:
  - white: stockfish-handicap:noise10
    black: stockfish:0
    games: 20
    colors: alternate
  - white: inverse-sf:worst-d6
    black: random
    games: 20
    colors: alternate
  - white: minimalchess-0.2:noise15
    black: stockfish-handicap:noise17
    games: 10
    colors: alternate
