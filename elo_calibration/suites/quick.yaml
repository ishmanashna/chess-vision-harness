name: quick
defaults:
  movetime_ms: 100
  max_plies: 200
  k_factor: 48
  initial_elo_non_stockfish: 500
openings: [startpos]
pairs:
  - white: stockfish-handicap:noise10
    black: stockfish:0
    games: 20
    colors: alternate
  - white: stockfish-handicap:noise17
    black: stockfish-handicap:noise10
    games: 10
    colors: alternate
  - white: minimalchess-0.2:noise15
    black: stockfish-handicap:noise17
    games: 10
    colors: alternate
  - white: inverse-sf:worst-d6
    black: random
    games: 10
    colors: alternate
  - white: random
    black: stockfish:0
    games: 10
    colors: alternate
